<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <title>Ajax para gatitos (TheCatApi)</title>
  
  <script
  src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="api-request.js"></script>
  <style>
    body
    {
        background-color: #f2f202;
        font-family: Arial, sans-serif;
    }
    
    #contenedor_carga 
    {
        background-color: rgba(240,240,240,0.5);
        height:100%;
        width:100%;
        position:fixed;
        transition: all 1s ease;
        z-index:10000;
    }
    #carga 
    {
        border: 5px solid #f3f3f3; /* Light grey */
        border-top-color: #d8d9da;
        border-top-style:groove;
        height:100px;
        width:100px; 
        border-radius: 100%;

        position:absolute;
        top:0;
        left:0;
        right:0;
        bottom:0;
        margin:auto;
        animation: girar 1s linear infinite;
    }
    
    @keyframes girar 
    {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
  </style>
  <script>
        window.onload = function() {
            // Ocultar el contenedor de carga al cargar la página
            var contenedor=document.getElementById("contenedor_carga");
            contenedor.style.visibility="hidden";
            contenedor.style.opacity="0";
        };
  </script>
</head>
<body>
  
    
   <div id="contenedor_carga" class="text-center mt-3">
        <div id="carga" class="spinner-border text-primary" role="status">
            <span class="sr-only">Cargando...</span>
        </div>
    </div>
    
    
    <div class="container mt-3">
        
        <div class="alert alert-primary" role="alert">
            <h4 class="alert-heading">Peticion Ajax</h4>
            <p>Esta es una peticion ajax que se realiza a un archivo php que devuelve un json.</p>
            <hr>
            <p class="mb-0">El resultado se muestra en el div con id resultado.</p>
        </div>
        <button type="button" class="btn btn-primary" id="leer" >Leer razas de gatos</button>
        <div id="resultado" class="mt-3" style="display:block; border: 3px solid #ccc; padding: 10px; border-radius: 5px; background-color: #d8d9da;">
            <h4>Resultado</h4>
    
            <div  class="mt-3">
                

               <ol id="resultado-ajax">
                    <!-- Aqui se mostrara el resultado de la peticion ajax -->
               </ol> 
            </div>
        </div>
       
      </div>

  
</body>
</html>
